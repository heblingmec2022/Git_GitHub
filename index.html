<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git and GitHub Study Notes</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --background: #eef4ff;
      --text: #172033;
      --surface: #ffffff;
      --heading: #2563eb;
    }

    body.dark-mode {
      --background: #111827;
      --text: #e5e7eb;
      --surface: #1f2937;
      --heading: #60a5fa;
    }

    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      color: var(--text);
      background: var(--background);
      font-family: Arial, sans-serif;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }

    main {
      padding: 2rem;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px #0002;
    }

    h1,
    h2,
    h3 {
      color: var(--heading);
    }

    pre {
      overflow-x: auto;
      padding: 1rem;
      border-radius: 8px;
      background: #111827;
      color: #e5e7eb;
    }

    code {
      font-family: Consolas, monospace;
    }

    a {
      color: var(--heading);
    }

    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button id="theme-toggle" type="button">Dark mode</button>

  <main id="content">Loading study notes...</main>

  <script>
    const themeToggle = document.getElementById("theme-toggle");

    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");

      const darkModeEnabled =
        document.body.classList.contains("dark-mode");

      themeToggle.textContent = darkModeEnabled
        ? "White mode"
        : "Dark mode";
    });

    fetch("README.md")
      .then((response) => {
        if (!response.ok) {
          throw new Error("README.md could not be loaded.");
        }

        return response.text();
      })
      .then((markdown) => {
        document.getElementById("content").innerHTML =
          marked.parse(markdown);
      })
      .catch(() => {
        document.getElementById("content").innerHTML = `
          <h1>Unable to load the study notes</h1>
          <p>
            Open the <a href="README.md">README.md</a> file.
          </p>
        `;
      });
  </script>
</body>
</html>
