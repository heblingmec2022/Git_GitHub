<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Git and GitHub study notes, from beginner to advanced topics."
    />
    <title>Git and GitHub Study Notes</title>

    <style>
      :root {
        --background: #eef4ff;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --primary: #4f46e5;
        --border: #dbe4f0;
        --code: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }

      body.dark-mode {
        --background: #0f172a;
        --surface: #1e293b;
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --border: #334155;
        --code: #020617;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .topbar {
        width: min(1100px, 92%);
        margin: auto;
        padding: 1rem 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand {
        color: var(--primary);
        font-size: 1.2rem;
        font-weight: 700;
        text-decoration: none;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      nav a,
      button {
        color: var(--text);
        font: inherit;
      }

      nav a {
        text-decoration: none;
      }

      nav a:hover {
        color: var(--primary);
      }

      button {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--surface);
        cursor: pointer;
        padding: 0.45rem 0.7rem;
      }

      main {
        width: min(900px, 92%);
        margin: 0 auto;
        padding: 3rem 0;
      }

      .hero {
        margin-bottom: 2rem;
        text-align: center;
      }

      .hero h1 {
        margin-bottom: 0.5rem;
        color: var(--primary);
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      .hero p {
        color: var(--muted);
        font-size: 1.1rem;
      }

      .content {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: clamp(1.2rem, 4vw, 3rem);
        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.1);
      }

      .content h1,
      .content h2,
      .content h3 {
        color: var(--primary);
        line-height: 1.25;
        margin-top: 2rem;
      }

      .content h1 {
        display: none;
      }

      .content a {
        color: var(--primary);
      }

      .content code {
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
        background: var(--border);
      }

      .content pre {
        overflow-x: auto;
        padding: 1rem;
        border-radius: 0.5rem;
        background: var(--code);
        color: #e2e8f0;
      }

      .content pre code {
        padding: 0;
        background: transparent;
      }

      .content li {
        margin-bottom: 0.35rem;
      }

      footer {
        padding: 2rem;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 650px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        nav {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="topbar">
        <a class="brand" href="#">Git & GitHub Study Notes</a>

        <nav aria-label="Main navigation">
          <a href="#readme-content">Study Guide</a>
          <a href="README.md">Raw README</a>
          <button id="theme-toggle" type="button">Toggle theme</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Git and GitHub Study Notes</h1>
        <p>
          A complete study guide covering Git and GitHub from basic to advanced
          concepts.
        </p>
      </section>

      <article id="readme-content" class="content">
        <p>Loading the README content...</p>
      </article>
    </main>

    <footer>
      <p>Built for Git and GitHub studies.</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
      defer
    ></script>

    <script>
      const content = document.getElementById("readme-content");
      const themeToggle = document.getElementById("theme-toggle");

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
      });

      window.addEventListener("load", async () => {
        try {
          const response = await fetch("README.md");

          if (!response.ok) {
            throw new Error("README.md could not be loaded.");
          }

          const markdown = await response.text();
          content.innerHTML = marked.parse(markdown);
        } catch (error) {
          content.innerHTML = `
            <h2>Unable to load the study notes</h2>
            <p>
              Open the
              <a href="README.md">README.md file</a>
              to view the complete content.
            </p>
          `;
        }
      });
    </script>
  </body>
</html>
