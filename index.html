<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git and GitHub Study Notes</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      color: #172033;
      background: #eef4ff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      padding: 2rem;
      border-radius: 12px;
      background: white;
      box-shadow: 0 8px 24px #0002;
    }

    h1, h2, h3 {
      color: #2563eb;
    }

    pre {
      overflow-x: auto;
      padding: 1rem;
      border-radius: 8px;
      background: #111827;
      color: #e5e7eb;
    }

    code {
      font-family: Consolas, monospace;
    }

    a {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main id="content">Loading study notes...</main>

  <script>
    fetch("README.md")
      .then((response) => {
        if (!response.ok) {
          throw new Error("README.md could not be loaded.");
        }

        return response.text();
      })
      .then((markdown) => {
        document.getElementById("content").innerHTML = marked.parse(markdown);
      })
      .catch(() => {
        document.getElementById("content").innerHTML = `
          <h1>Unable to load the study notes</h1>
          <p>
            Open the
            <a href="README.md">README.md</a>
            file to read the complete content.
          </p>
        `;
      });
  </script>
</body>
</html>
